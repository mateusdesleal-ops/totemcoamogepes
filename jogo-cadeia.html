<body data-page="game-chain">
  <div class="kiosk-shell">
    <header class="topbar">
      <a class="topbar__brand js-admin-trigger" href="index.html?interactive=1" aria-label="Coamo - início"><img src="assets/logo_verde.png" alt="Coamo"></a>
      <div class="topbar__context"><span class="topbar__eyebrow">GEPES</span><span class="topbar__label">Monte a cadeia</span></div>
      <nav class="topnav" aria-label="Navegação principal">
        <a class="topnav__item" href="index.html?interactive=1">Início</a>
        <a class="topnav__item" href="vagas.html">Vagas</a>
        <a class="topnav__item" href="apresentacao.html">Conheça a Coamo</a>
        <a class="topnav__item is-active" data-feature="games" href="jogos.html">Coamo Games</a>

        <button class="topnav__item topnav__item--presentation js-start-presentation" type="button">▶ Apresentação</button>
      </nav>
    </header>
    <main class="game-single-page">
      <div class="game-single-toolbar"><a class="game-back-link" href="jogos.html">← Voltar aos jogos</a><span>DESAFIO DE SEQUÊNCIA</span></div>
            <section class="game-cover" data-game-cover data-target="#gameChain">

        <div class="game-cover__shade" aria-hidden="true"></div>
        <button class="game-cover__start" type="button" data-game-cover-start>Montar a cadeia<span>→</span></button>
      </section>
<section class="game-panel game-panel--single game-stage-hero--chain game-play-hidden-v32" id="gameChain">

        <div class="chain-track chain-track--v18" id="chainTrack"></div>
        <div class="game-result game-result--chain" id="chainResult" hidden></div>
        <div class="chain-options chain-options--v18" id="chainOptions"></div>
      </section>
    </main>
  </div>
  <div class="game-confetti" id="gameConfetti" aria-hidden="true"></div>
