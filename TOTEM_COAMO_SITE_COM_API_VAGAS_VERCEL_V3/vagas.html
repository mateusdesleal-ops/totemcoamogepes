<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Vagas • Coamo</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="styles.css?v=20260312v3" rel="stylesheet"/>
</head>
<body>
<div class="app" id="appRoot">
<div class="frame" role="application">
<!-- Sidebar -->
<aside aria-label="Menu" class="sidebar">
<div class="brand">
<img alt="Coamo" class="brand__logo" src="assets/logo.png"/>
</div>
<nav aria-label="Navegação" class="nav">
<a class="nav__btn" href="index.html">Home</a>
<a aria-current="page" class="nav__btn" href="vagas.html">Vagas</a><a class="nav__btn" href="sorteio.html">Sorteio</a><a class="nav__btn" href="apresentacao.html" id="btnApresentacao">Apresentação</a>
</nav>
<div class="sidebar__spacer"></div>
<!-- QR sempre visível no menu -->
<section aria-label="Faça parte da Coamo" class="qr">
<div class="qr__card">
<div class="qr__title">Faça parte da Coamo</div>
<div class="qr__subtitle">É simples e rápido</div>
<div class="qr__wrap">
<div class="qr__imgWrap"><div class="qr__inner"><img alt="QR Code para candidatura" class="qr__img" src="assets/qr-selecty.png"/></div></div>
</div>
<div aria-label="Passo a passo" class="qr__steps">
<div>1. Escaneie o QR Code</div>
<div>2. Cadastre seu currículo</div>
<div>3. Acompanhe sua candidatura</div>
</div>
</div>
</section>
</aside>
<!-- Main -->
<main class="main">
<section class="card card--full">
<div class="card__title">Buscar vagas</div>
<div class="filters">
<label class="field">
<span>Cargo</span>
<input id="qCargo" placeholder="Ex.: Ajudante, Analista..." type="text"/>
</label>
<label class="field">
<span>Cidade</span>
<input id="qCidade" placeholder="Ex.: Campo Mourão, Paranaguá..." type="text"/>
</label>
</div>
<div class="muted" id="vagasCount" style="margin-top:10px;">Carregando vagas...</div>
</section>
<section aria-live="polite" class="vagasList" id="vagasList"></section>
</main>
<!-- Onda fixa no rodapé -->
<img alt="" aria-hidden="true" class="waves" src="assets/waves.png"/>
</div>
</div>
<script src="app.js?v=20260312v3"></script>
</body>
</html>
