<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4d2b">
  <title>Coamo • Descubra sua área na Coamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.v40.css?v=40.0">
</head>
<body data-page="game-profile">
  <div class="kiosk-shell">
    <header class="topbar">
      <a class="topbar__brand js-admin-trigger" href="index.html?interactive=1" aria-label="Coamo - início"><img src="assets/logo_verde.png" alt="Coamo"></a>
      <div class="topbar__context"><span class="topbar__eyebrow">GEPES</span><span class="topbar__label">Descubra sua área</span></div>
      <nav class="topnav" aria-label="Navegação principal">
        <a class="topnav__item" href="index.html?interactive=1">Início</a>
        <a class="topnav__item" href="vagas.html">Vagas</a>
        <a class="topnav__item" href="apresentacao.html">Conheça a Coamo</a>
        <a class="topnav__item is-active" data-feature="games" href="jogos.html">Coamo Games</a>
        <a class="topnav__item" data-feature="raffle" href="sorteio.html">Sorteio</a>
        <button class="topnav__item topnav__item--presentation js-start-presentation" type="button">▶ Apresentação</button>
      </nav>
    </header>
    <main class="game-single-page">
      <div class="game-single-toolbar"><a class="game-back-link" href="jogos.html">← Voltar aos jogos</a><span>QUIZ INTERATIVO</span></div>
            <section class="game-cover" data-game-cover data-target="#gameProfile">
        <img class="game-cover__poster" src="assets/games/v34/area_banner.png" alt="Descubra sua área na Coamo">
        <div class="game-cover__shade" aria-hidden="true"></div>
        <button class="game-cover__start" type="button" data-game-cover-start>Começar quiz<span>→</span></button>
      </section>
<section class="game-panel game-panel--single game-stage-hero--profile game-play-hidden-v32" id="gameProfile">
        <div class="game-stage-poster-v34"><img src="assets/games/v34/area_banner.png" alt="Descubra sua área — Coamo Games"></div>
        <div class="game-progress game-progress--v18"><span id="profileProgressBar"></span></div>
        <div class="profile-game" id="profileGame"></div>
      </section>
    </main>
  </div>
  <div class="game-confetti" id="gameConfetti" aria-hidden="true"></div>
  <script src="app.v40.js?v=40.0"></script>
</body>
</html>
