<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4d2b">
  <title>Vagas • Coamo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.v42.css?v=42.0">

  <!-- PWA / modo totem fullscreen V53 -->
  <link rel="manifest" href="manifest.webmanifest?v=53.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Coamo Totem">
  <meta name="apple-mobile-web-app-title" content="Coamo Totem">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png?v=52.0">
  <script src="pwa.v53.js?v=53.0" defer></script>
</head>
<body data-page="vagas">
  <div class="kiosk-shell">
    <header class="topbar">
      <a class="topbar__brand js-admin-trigger" href="index.html?interactive=1" aria-label="Coamo - início">
        <img src="assets/logo_verde.png" alt="Coamo">
      </a>
      <div class="topbar__context"><span class="topbar__eyebrow">GEPES</span><span class="topbar__label">Recrutamento e Seleção</span></div>
      <nav class="topnav" aria-label="Navegação principal">
        <a class="topnav__item" href="index.html?interactive=1">Início</a>
        <a class="topnav__item is-active" href="vagas.html">Vagas</a>
        <a class="topnav__item" href="apresentacao.html">Conheça a Coamo</a>
        <a class="topnav__item" data-feature="games" href="jogos.html">Coamo Games</a>
        <a class="topnav__item" data-feature="raffle" href="sorteio.html">Sorteio</a>
        <button class="topnav__item topnav__item--presentation js-start-presentation" type="button">▶ Apresentação</button>
      </nav>
    </header>

    <main class="page-main page-main--vacancies">
      <section class="page-heading">
        <div>
          <span class="section-kicker">Oportunidades</span>
          <h1>Encontre oportunidades na Coamo.</h1>
          <p>Pesquise por cargo ou cidade. As oportunidades são carregadas diretamente da Selecty.</p>
        </div>
        <div class="page-heading__badge" id="vagasCount">Carregando vagas…</div>
      </section>

      <section class="vacancy-layout">
        <div class="vacancy-workspace">
          <div class="filter-panel">
            <label class="filter-field">
              <span>Cargo</span>
              <input id="qCargo" type="search" placeholder="Ex.: Maquinista, Analista, Vigilante…" autocomplete="off">
            </label>
            <label class="filter-field filter-field--city">
              <span>Cidade</span>
              <select id="qCidade">
                <option value="">Todas as cidades</option>
              </select>
            </label>
            <button class="btn btn--soft" id="clearFilters" type="button">Limpar filtros</button>
          </div>

          <div class="vacancy-status" id="vagasStatus" aria-live="polite"></div>
          <section class="vacancy-grid" id="vagasList" aria-live="polite"></section>
        </div>
      </section>
    </main>
  </div>
  <script src="app.v42.js?v=53.0"></script>
</body>
</html>
